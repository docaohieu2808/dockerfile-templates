name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: base images move even when this repo does not.
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: react-nginx
            port: 8080
            path: /
            arm64: true
          - name: nodejs
            port: 8080
            path: /health
            arm64: true
          - name: nextjs
            port: 3000
            path: /health
          - name: nestjs
            port: 3000
            path: /health
            target: prod
          - name: java-spring-boot
            port: 8080
            path: /health
          - name: dotnet
            port: 8080
            path: /health
          - name: laravel
            port: 8080
            path: /up
            run_args: "-e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          - name: django
            port: 8000
            path: /health
            run_args: "-e DJANGO_SECRET_KEY=ci-only-not-a-secret"
          - name: flask
            port: 8000
            path: /health
          - name: golang
            port: 8080
            path: /health
            arm64: true
          - name: rust
            port: 8080
            path: /health
          - name: ruby-rails
            port: 3000
            path: /health
          - name: swift-vapor
            port: 8080
            path: /health
          - name: cpp
            mode: run
            expect: "Hello from C++"
          - name: dart
            port: 8080
            path: /health
    env:
      IMAGE: templates/${{ matrix.name }}:ci
      CONTEXT: templates/${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: templates/${{ matrix.name }}/Dockerfile
          failure-threshold: warning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Smoke test (linux/amd64)
        env:
          MODE: ${{ matrix.mode || 'http' }}
          RUN_ARGS: ${{ matrix.run_args }}
        run: |
          if [ "$MODE" = run ]; then
            # shellcheck disable=SC2086
            .github/scripts/smoke.sh "$IMAGE" run "${{ matrix.expect }}" $RUN_ARGS
          else
            # shellcheck disable=SC2086
            .github/scripts/smoke.sh "$IMAGE" http "${{ matrix.port }}" "${{ matrix.path }}" $RUN_ARGS
          fi

      # Only templates that claim multi-arch support in the README.
      - name: Set up QEMU
        if: matrix.arm64
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Build (linux/arm64)
        if: matrix.arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE }}-arm64
          cache-from: type=gha,scope=${{ matrix.name }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-arm64

      - name: Smoke test (linux/arm64, emulated)
        if: matrix.arm64
        run: |
          .github/scripts/smoke.sh "${IMAGE}-arm64" http "${{ matrix.port }}" "${{ matrix.path }}" --platform linux/arm64
